# TraceConfig for Dyna perf captures (Unit 1).
# Push and run:  adb shell perfetto -c /data/local/tmp/dyna-perfetto.cfg -o /data/local/tmp/trace
# scripts/perf/capture.sh perfetto does both steps for you.
# Duration is fixed at 20 s; edit duration_ms to trace longer.

duration_ms: 20000
flush_period_ms: 1000
write_into_file: false

buffers: {
    size_kb: 16384
    fill_policy: RING_BUFFER
}

# CPU scheduling: shows whether the island thread is runnable-but-not-running
# (main-thread contention) during a morph.
data_sources: {
    config {
        name: "linux.sched"
        sched_config: {
            latency_tracing: false
            thread_time_in_state: true
        }
    }
}

data_sources: {
    config {
        name: "linux.ftrace"
        ftrace_config: {
            ftrace_events: "sched/sched_switch"
            ftrace_events: "sched/sched_wakeup"
            ftrace_events: "power/cpu_frequency"
            ftrace_events: "power/cpu_idle"
            ftrace_events: "power/suspend_resume"
            ftrace_events: "binder/binder_transaction"
            ftrace_events: "binder/binder_transaction_received"
            ftrace_events: "kmem/rss_stat"
            atrace_categories: "gfx"
            atrace_categories: "view"
            atrace_categories: "input"
            atrace_categories: "wm"
            atrace_categories: "am"
            atrace_categories: "dalvik"
            atrace_categories: "binder_driver"
            atrace_categories: "aidl"
        }
    }
}

# Per-frame timing straight from SurfaceFlinger: the authoritative source when
# gfxinfo cannot see TYPE_ACCESSIBILITY_OVERLAY windows (plan question Q1).
data_sources: {
    config {
        name: "android.surfaceflinger.frametimeline"
    }
}
