name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run unit tests and assemble debug
      run: ./gradlew testDebugUnitTest assembleDebug --console=plain

    - name: Run lintDebug (non-blocking)
      continue-on-error: true
      run: ./gradlew lintDebug --console=plain
      # Note: lintDebug is marked continue-on-error: true until the lint baseline is clean.

    - name: Upload test report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-failure-reports
        path: app/build/reports/tests/
